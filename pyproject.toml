[project]
name = "docsocr"
version = "0.1.0"
description = "DocsOCR prototype for annotation-driven PDF layout parsing with optional DocLayout-YOLO inference."
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pillow>=10.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pdf = [
  "pymupdf>=1.24",
]
ocr = [
  "pytesseract>=0.3.10",
]
doclayout = [
  "doclayout-yolo>=0.0.3",
  "huggingface-hub>=0.23",
]
# Only needed to cross-check the AP implementation against the reference one.
# The evaluation harness itself is pure Python and needs nothing here; without
# this extra the parity tests in tests/test_evaluation.py skip themselves.
eval = [
  "pycocotools>=2.0",
]

[project.scripts]
pdf-layout-parser = "pdf_layout_parser.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

